      <div style="font-size:12px;color:var(--text3);max-width:420px;text-align:center;line-height:1.5;border-top:1px solid var(--border);padding-top:16px;margin-top:20px">
        O CSV completo inclui <b>NIF, CC, morada, email, contacto</b> e a observação do chefe. Para um ficheiro que possas partilhar sem expor dados pessoais, usa a versão limpa:
      </div>
      <button class="btn btn-dark btn-sm" data-action="export-csv-safe" style="margin-top:10px">⬇ CSV sem dados pessoais</button>
      <div style="border-top:1px solid var(--border);width:100%;max-width:420px;margin:24px 0 0"></div>
      <div style="font-size:16px;font-weight:700;margin:20px 0 4px">🗄️ Cópia de segurança completa</div>
      <div style="font-size:12px;color:var(--text3);max-width:420px;text-align:center;line-height:1.55;margin-bottom:14px">
        O CSV acima só leva os <b>negócios</b>. Isto descarrega <b>tudo</b> — negócios, stock, stock norma, eventos, inscrições, histórico de status, objetivos, escala e equipa — num ficheiro por conjunto. Se um dia perderes o acesso, é isto que te salva.
      </div>
      <button class="btn btn-orange" data-action="export-tudo" ${S.loading?'disabled':''} style="padding:12px 28px">${S.loading?'A preparar…':'⬇ Descarregar tudo (9 ficheiros)'}</button>
      <div style="font-size:11px;color:var(--text3);max-width:400px;text-align:center;line-height:1.5;margin-top:10px">
        O browser vai pedir autorização para descarregar vários ficheiros — aceita. Conjuntos sem dados não geram ficheiro.
      </div>
    </div>`;
  }

  let body;
  if(S.gppBusca&&S.gppBusca.trim()){
    const q=S.gppBusca.trim().toLowerCase();
    const campos=r=>[r.id_cliente,r.model,r.version,r.mat,r.chas,r.enc].map(x=>(x||'').toString().toLowerCase());
    const res=recs.filter(r=>campos(r).some(c=>c.includes(q)));
    body=`<div class="gpp-tot-head">Resultados para "${esc(S.gppBusca)}" · <b>${res.length}</b></div>
      ${res.length===0?'<div class="gpp-empty">Nada encontrado.</div>':`
      <div class="gpp-card" style="margin:8px 16px"><table class="gpp-ltable">
        <thead><tr><th>Cliente</th><th>Modelo</th><th>Matrícula</th><th>Estado</th><th>Vendedor</th></tr></thead>
        <tbody>${res.map(r=>`<tr class="gpp-lrow" data-action="open-record-from-dash" data-id="${r.id}">
          <td style="font-weight:600">${esc(r.id_cliente||'—')}</td>
          <td>${esc(r.model||'')} ${esc(r.version||'')}</td>
          <td>${esc(r.mat||'—')}</td>
          <td><span class="gpp-tipo-badge">${esc(r.status||'')}</span></td>
          <td>${esc(vendName(r.vendedor_id)||'')}</td></tr>`).join('')}</tbody>
      </table></div>`}`;
  }
  else if(sec==='home')body=mesBar+(recs.filter(r=>r.status==='Retail'&&!r.col_298).length?`${(()=>{const semData=recs.filter(r=>r.status==='Retail'&&!r.col_298);return`<div class="gpp-alerta ${S.dashAlertOpen==='sem298'?'open':''}"><div class="gpp-alerta-head" data-action="dash-alert-toggle" data-id="sem298"><span>⚠️</span><span><b>${semData.length}</b> mota${semData.length>1?'s':''} em Retail sem data 298 — não contam nos totais</span><span class="gpp-alerta-arrow">${S.dashAlertOpen==='sem298'?'▾':'▸'}</span></div>${S.dashAlertOpen==='sem298'?`<div class="gpp-alerta-lista">${semData.map(r=>`<div class="gpp-alerta-item" data-action="open-record-from-dash" data-id="${r.id}"><b>${esc(r.id_cliente||'(sem cliente)')}</b><span>${esc(r.model||'')} ${esc(r.version||'')}</span><span class="gpp-alerta-tipo">${esc(r.type||'?')}</span><span style="color:var(--text3)">${esc(vendName(r.vendedor_id)||'')}</span></div>`).join('')}</div>`:''}</div>`})()}`:'')+tabelaResumo()+homeAcoes();
  else if(sec==='funil')body=funilView();
  else if(sec==='fechados')body=fechadosView();
  else if(sec==='perdidos')body=perdidosView();
  else if(sec==='carteira')body=carteiraChart()+listaEstado('Carteira',r=>r.mes1);
  else if(sec==='retail')body=retailView();
  else if(sec==='comercio')body=comercioView();
  else if(sec==='pendentes')body=pendentesView();
  else if(sec==='stock')body=stockView('usada');
  else if(sec==='depreciacao')body=depreciacaoView();
  else if(sec==='demos')body=normaView();
  else if(sec==='comissoes')body=comissoesView();
  else if(sec==='evento')body=eventoView();
  else if(sec==='exportar')body=exportarView();
  else body=tabelaResumo();

  return`
  <div class="app-layout ${S.gppSideOff?'side-off':''}">
  <div class="gpp-side">${renderViewSelector()}${nav}</div>
  <div class="main-panel" style="width:100%">
  ${header}
  <div class="content">${body}</div>
  ${tabbar}
  </div>
  ${sheet}
  </div>`;
}
function render(){
  const app=document.getElementById('app');
  const ce=app.querySelector('.content'),st=ce?ce.scrollTop:0,ps=app.dataset.screen||'';
  const screens={loading:'<div class="content"><div class="center-screen"><p style="color:var(--text3)">A carregar...</p></div></div>',login:renderLogin,list:renderList,detail:renderDetail,edit:renderEdit,dashboard:renderDashboard,escala:renderEscala,password:renderPassword,stockvend:renderStockVend,evento:renderEventoVend};
  const fn=screens[S.screen];
  app.innerHTML=typeof fn==='function'?fn():fn;
  app.dataset.screen=S.screen;
  if(ps===S.screen){const nc=app.querySelector('.content');if(nc)nc.scrollTop=st}
  bindEvents();
}

function bindEvents(){
  const app=document.getElementById('app');
  app.oninput=function(e){
    const el=e.target;
    if(el.id==='retail-mat-search'){
      S.retailMat=el.value;
      render();
      const inp=document.getElementById('retail-mat-search');
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
      return;
    }
    if(el.id==='dep-taxa-inp'){
      S.depTaxa=el.value===''?0:(parseFloat(el.value)||0);
      try{localStorage.setItem('bc_dep_taxa',String(S.depTaxa))}catch(e){}
      render();
      const inp=document.getElementById('dep-taxa-inp');
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
      return;
    }
    if(el.id==='gpp-search'){
      S.gppBusca=el.value;
      // Re-render mas devolver o foco ao campo
      render();
      const inp=document.getElementById('gpp-search');
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    }
    if(el.id==='gpp-search-m'){
      S.gppBusca=el.value;
      render();
      const inp=document.getElementById('gpp-search-m');
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    }
    if(el.id==='insc-busca'){
      S.inscBusca=el.value;
      render();
      const inp=document.getElementById('insc-busca');
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    }
  };
  app.onchange=function(e){
    const el=e.target;
    if(el.dataset&&el.dataset.depId){const id=el.dataset.depId,v=el.value;saveStockField(id,'dep_manual',(v===''||v==null)?null:Number(v));return;}
    if(el.dataset&&el.dataset.pedMotivo){const sel=Object.assign({},S.pedAutSel||{});sel[String(el.dataset.pedMotivo)]=el.value;setState({pedAutSel:sel});return;}
    if(el.dataset&&el.dataset.depPrep){const id=el.dataset.depPrep,v=el.value;saveStockField(id,'dep_prep',(v===''||v==null)?null:Number(v));return;}
    if(el.dataset&&el.dataset.depVenda){const id=el.dataset.depVenda,v=el.value;saveStockField(id,'venda_ficticia',(v===''||v==null)?null:Number(v));return;}
    if(el.dataset&&el.dataset.obsGestor){saveObsGestor(el.dataset.obsGestor,el.value);return;}
    if(el.dataset&&el.dataset.vdF){S.vdForm=Object.assign({},S.vdForm,{[el.dataset.vdF]:el.value});if(el.dataset.vdF==='pvp'||el.dataset.vdF==='valor_entrada')render();return;}
    if(el.classList&&el.classList.contains('stock-kms-inp')){saveKmsVend(el.dataset.kmsTipo,el.dataset.kmsId,el.value);return;}
    if(el.classList&&el.classList.contains('stock-vend-estado')){
      const estado=el.value;
      // Se mudar para "A negociar" e ninguem tem, assume; senao so muda estado
      stockMudarEstado(el.dataset.stockId,estado,estado==='A negociar');return;
    }
    if(el.dataset&&el.dataset.stockId){
      const f=el.dataset.stockF;
      let v;
      if(f==='maxterauto')v=el.checked;
      else if(f==='valor_min'||f==='valor_anunciado'||f==='valor_campanha'||f==='valor_entrada')v=el.value?parseFloat(el.value):null;
      else if(f==='kms'||f==='ano')v=el.value?parseInt(el.value):null;
      else if(f==='data_rececao')v=el.value||null;
      else if(f==='negociado_por')v=el.value||null;
      else v=el.value;
      saveStockField(el.dataset.stockId,f,v);return;
    }
    if(el.dataset&&el.dataset.action==='carteira-mes-sel'){setState({carteiraMes:el.value});return;}
    if(el.dataset&&el.dataset.action==='dash-mes-sel'){setState({dashMes:el.value});return;}
    if(el.dataset&&el.dataset.action==='obj-equipa-save'){saveObjEquipa(el.dataset.mes,el.value,el.dataset.tipo||'novas').then(()=>render());return;}
    if(el.dataset&&el.dataset.normaId){
      const id=el.dataset.normaId,campo=el.dataset.normaF;let valor=el.value;
      if(campo==='kms'||campo==='preco')valor=valor===''?null:parseFloat(valor);
      if(campo==='data_matricula')valor=valor||null;
      saveNormaCampo(id,campo,valor).then(()=>{
        // se meteu matrícula e estava 'Em falta', promove para Matriculada
        if(campo==='matricula'&&valor){const n=(S.norma||[]).find(x=>String(x.id)===String(id));if(n&&n.estado!=='Matriculada')saveNormaCampo(id,'estado','Matriculada');}
      });
      return;
    }
    if(el.dataset&&el.dataset.inscId){saveInscricaoCampo(el.dataset.inscId,el.dataset.inscF,el.value);return;}
    if(el.dataset&&el.dataset.action==='evento-sel'){const id=parseInt(el.value);S.eventoSel=id;loadRanking(id).then(()=>render());return;}
    if(el.dataset&&el.dataset.action==='insc-vend-filtro'){S.inscVendFiltro=el.value;render();return;}
    if(el.dataset&&el.dataset.action==='evento-lotacao'){saveEventoCampo(parseInt(el.dataset.id),'lotacao',el.value?parseInt(el.value):null);return;}
    if(el.dataset&&el.dataset.action==='retail-vend'){setState({retailVend:el.value});return;}
    if(el.dataset&&el.dataset.action==='retail-tipo'){setState({retailTipo:el.value});return;}
    if(el.dataset&&el.dataset.field&&(el.dataset.field==='retoma'||el.dataset.field==='status'||el.dataset.field==='gar'||el.dataset.field==='type'||el.dataset.field==='origin')&&S.screen==='edit'){
      collectFormData();
      // Sugestão automática de data de alerta ao passar para funil (só se estiver vazia)
      if(el.dataset.field==='status'&&FUNIL.includes(S.form.status)&&!S.form.alert_date){
        S.form.alert_date=sugereAlerta(S.form.status);
      }
      render();return;
    }
  };
  app.onclick=function(e){
    const el=e.target.closest('[data-action]');if(!el)return;
    const a=el.dataset.action;
    switch(a){
      case'login':{const em=document.getElementById('f-email')?.value?.trim(),pw=document.getElementById('f-pw')?.value;if(!em||!pw){setState({error:'Preenche email e password.'});return}setState({loading:true,error:''});supabaseAuth(em,pw).then(r=>{S.token=r.access_token;return afterAuth()}).catch(e=>setState({error:e.message,loading:false}));break}
      case'go-password':setState({screen:'password',pwErr:'',pwMsg:''});break;
      case'pw-back':setState({screen:isAdmin()?'dashboard':'list',pwErr:'',pwMsg:''});break;
      case'pw-save':{
        const atual=document.getElementById('pw-atual')?.value||'';
        const nova=document.getElementById('pw-nova')?.value||'';
        const conf=document.getElementById('pw-conf')?.value||'';
        if(!atual||!nova||!conf){setState({pwErr:'Preenche todos os campos.',pwMsg:''});break}
        if(nova!==conf){setState({pwErr:'A password nova e a confirmação não coincidem.',pwMsg:''});break}
        if(nova.length<6){setState({pwErr:'A password nova tem de ter pelo menos 6 caracteres.',pwMsg:''});break}
        if(nova===atual){setState({pwErr:'A password nova tem de ser diferente da atual.',pwMsg:''});break}
        setState({pwLoading:true,pwErr:'',pwMsg:''});
        changePassword(atual,nova)
          .then(()=>setState({pwLoading:false,pwMsg:'Password alterada com sucesso.',pwErr:''}))
          .catch(e=>setState({pwLoading:false,pwErr:e.message,pwMsg:''}));
        break;
      }
      case'logout':clearSession();setState({token:null,records:[],me:null,team:[],objetivos:[],viewVendedor:null,screen:'login',error:''});break;
      case'toggle-vsel':setState({vselOpen:!S.vselOpen});break;
      case'dash-linha':setState({dashLinha:el.dataset.linha});break;
      case'dash-periodo':setState({dashPeriodo:el.dataset.p});break;
      case'dash-section':setState({dashSection:el.dataset.s,dashAlertOpen:null});break;
      case'dash-alert-toggle':setState({dashAlertOpen:S.dashAlertOpen===el.dataset.id?null:el.dataset.id});break;
      case'open-record-from-dash':{const r=S.records.find(x=>String(x.id)===String(el.dataset.id));if(r)setState({selected:r,screen:'detail',gppMais:false});break}
      case'export-csv':{if(!S.stockLoaded){loadStock().then(()=>exportCSV(true));}else exportCSV(true);break}
      case'export-csv-safe':{if(!S.stockLoaded){loadStock().then(()=>exportCSV(false));}else exportCSV(false);break}
      case'export-tudo':exportarTudo();break;
      case'export-comissoes':exportComissoes();break;
      case'go-escala':{setState({loading:true});Promise.all([loadTeam(),loadEscala()]).then(()=>setState({screen:'escala',loading:false})).catch(e=>setState({error:e.message,loading:false,screen:'escala'}));break}
      case'go-stock-vend':{setState({loading:true});Promise.all([loadStockPublico(),loadNormaPublico()]).then(()=>setState({screen:'stockvend',loading:false}));break}
      case'go-evento':{setState({loading:true});const ev=eventoAtual();S.eventoSel=ev?ev.id:null;recarregarEvento().then(()=>setState({screen:'evento',loading:false,inscAdding:false}));break}
      case'evento-voltar':setState({screen:isAdmin()?'dashboard':'list'});break;
      case'insc-add-open':setState({inscAdding:true,inscForm:{estado:'Confirmado',acompanhantes:0},eventoErr:''});break;
      case'insc-add-cancel':setState({inscAdding:false,inscForm:{},eventoErr:''});break;
      case'insc-save-new':saveInscricaoNova();break;
      case'insc-del':delInscricao(el.dataset.id);break;
      case'vd-add':setState({vdAdding:true,vdForm:{},vdErr:''});break;
      case'vd-cancel':setState({vdAdding:false,vdForm:{},vdErr:''});break;
      case'vd-save':saveVendaDireta();break;
      case'norma-pdf':exportNormaPDF();break;
      case'norma-abrir':setState({normaAberta:String(S.normaAberta)===String(el.dataset.id)?null:el.dataset.id});break;
      case'norma-vendida':{const n=(S.norma||[]).find(x=>String(x.id)===String(el.dataset.id));if(n)saveNormaCampo(el.dataset.id,'vendida',!n.vendida);break;}
      case'norma-toggle-seguro':{const n=(S.norma||[]).find(x=>String(x.id)===String(el.dataset.id));if(n)saveNormaCampo(el.dataset.id,'tem_seguro',!n.tem_seguro);break;}
      case'norma-subst-fechar':setState({normaSubst:null});break;

      case'evento-save-new':saveEventoNovo();break;

      case'escala-linha':setState({escalaLinha:el.dataset.linha});break;

      case'escala-prev':escalaShiftMes(-1);loadEscala().then(()=>render());break;
      case'escala-next':escalaShiftMes(1);loadEscala().then(()=>render());break;
      case'go-dashboard':setState({screen:'dashboard',viewVendedor:null,vselOpen:false,statusFilter:'all',alertFilter:null,alertIds:[],search:'',renderLimit:50});break;
      case'retail-modo':setState({retailModo:el.dataset.m});break;
      case'retail-ord':{const o=el.dataset.o;if(S.retailOrd===o)setState({retailDir:S.retailDir==='asc'?'desc':'asc'});else setState({retailOrd:o,retailDir:'asc'});break;}

      case'stock-cat':setState({stockCat:el.dataset.c,stockAdding:false});break;

      case'stock-add':setState({stockAdding:true,stockFormMax:false});break;

      case'stock-toggle-seguro':{const m=S.stock.find(x=>String(x.id)===String(el.dataset.id));if(m)saveStockField(el.dataset.id,'tem_seguro',!m.tem_seguro);break;}
      case'stock-toggle-consig':{const m=S.stock.find(x=>String(x.id)===String(el.dataset.id));if(m)saveStockField(el.dataset.id,'consignada',!m.consignada);break;}
      case'stock-export-csv':exportStockCSV();break;
      case'stock-export-pdf':exportStockPDF();break;
      case'export-xlsx':exportarExcelTudo();break;
      case'gpp-toggle-side':{const v=!S.gppSideOff;try{localStorage.setItem('bc_side',v?'1':'0')}catch(e){}setState({gppSideOff:v});break;}
      case'ped-aut-abrir':setState({pedAutOpen:!S.pedAutOpen});break;
      case'ped-aut-fechar':setState({pedAutOpen:false});break;
      case'ped-aut-limpar':setState({pedAutSel:{}});break;
      case'ped-aut-toggle':{const id=String(el.dataset.id);const sel=Object.assign({},S.pedAutSel||{});
        if(sel[id]){delete sel[id];}else{const n=(S.norma||[]).find(x=>String(x.id)===id);sel[id]=(n&&n.vendida)?'vendida':'minimos';}
        setState({pedAutSel:sel});break;}
      case'ped-aut-copiar':{const t=pedAutTexto();if(t)copiarTexto(t,el);break;}
      case'stock-anular-seguro':saveStockField(el.dataset.id,'seguro_anulado',true);break;
      case'stock-form-toggle-max':setState({stockFormMax:!S.stockFormMax});break;
      case'stock-cancel':setState({stockAdding:false});break;
      case'stock-save-new':{
        const modelo=(document.getElementById('sf-modelo')?.value||'').trim();
        if(!modelo){alert('Indica o modelo.');break;}
        const dados={
          modelo,
          matricula:document.getElementById('sf-mat')?.value||null,
          kms:document.getElementById('sf-kms')?.value?parseInt(document.getElementById('sf-kms').value):null,
          valor_min:document.getElementById('sf-min')?.value?parseFloat(document.getElementById('sf-min').value):null,
          valor_anunciado:document.getElementById('sf-anun')?.value?parseFloat(document.getElementById('sf-anun').value):null,
          valor_campanha:document.getElementById('sf-camp')?.value?parseFloat(document.getElementById('sf-camp').value):null,
          estado:document.getElementById('sf-estado')?.value||'Disponível',
          negociado_por:document.getElementById('sf-neg')?.value||null,
          maxterauto:S.stockFormMax||false,
          categoria:(S.gppSec==='demos'?'demo':'usada')
        };
        addStockMotaFull(dados);break;
      }
      case'stock-del':{if(confirm('Apagar esta mota do stock?'))deleteStockMota(el.dataset.id);break}
      case'view-vendedor':{const id=el.dataset.id||null;setState({viewVendedor:id,screen:'list',vselOpen:false,statusFilter:'all',alertFilter:null,alertIds:[],search:'',monthFilter:[],renderLimit:50});break}
      case'save-nps':{e.stopPropagation();const vid=el.dataset.id;const gi=s=>{const x=document.querySelector(`[${s}="${vid}"]`);return x&&x.value!==''?parseFloat(x.value):null};const patch={num_inqueritos:gi('data-nps-inq')||0,nps:gi('data-nps-nps'),csi:gi('data-nps-csi')};el.textContent='\u2026';saveNps(vid,patch).then(()=>render()).catch(err=>{alert('Erro: '+err.message);render()});break}
      case'save-objetivo':{e.stopPropagation();const vid=el.dataset.id;const inp=document.querySelector(`[data-obj-input="${vid}"]`);const val=parseInt(inp&&inp.value?inp.value:'0')||0;el.textContent='\u2026';saveObjetivo(vid,val).then(()=>render()).catch(err=>{alert('Erro: '+err.message);render()});break}
      case'refresh':{const p=isAdmin()?Promise.all([loadObjetivos(),loadObjEquipa(),loadTeam(),loadNps()]):Promise.resolve();p.then(()=>Promise.all([recarregarEvento(),loadRecords()]));break}
      case'open-sidebar':setState({sidebarOpen:!S.sidebarOpen});break;
      case'toggle-sidebar':setState({sidebarOpen:!S.sidebarOpen});break;
      case'close-sidebar':setState({sidebarOpen:false});break;
      case'load-more':setState({renderLimit:(S.renderLimit||50)+50});break;
      case'sidebar-filter':setState({statusFilter:el.dataset.status,monthFilter:[],bevFilter:'all',xevFilter:'all',alertFilter:null,alertIds:[],renderLimit:50});break;
      case'alert-filter':{const id=el.dataset.alert;const ids=el.dataset.ids.split(',').map(Number);if(S.alertFilter===id)setState({alertFilter:null,alertIds:[],statusFilter:'all'});else setState({alertFilter:id,alertIds:ids,statusFilter:'_alert'});break}
      case'filter':setState({statusFilter:el.dataset.status,monthFilter:[],bevFilter:'all',xevFilter:'all'});break;
      case'filter-month':{const m=el.dataset.month;const cur=[...S.monthFilter];const i=cur.indexOf(m);if(i>=0)cur.splice(i,1);else cur.push(m);setState({monthFilter:cur});break}
      case'filter-bev':setState({bevFilter:S.bevFilter==='1'?'all':'1'});break;
      case'filter-xev':setState({xevFilter:S.xevFilter==='1'?'all':'1'});break;
      case'clear-filters':setState({monthFilter:[],bevFilter:'all',xevFilter:'all'});break;
      case'quick-month':{const d=new Date();const m=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;setState({monthFilter:[m],filterYear:String(d.getFullYear())});break}
      case'quick-year':{const y=String(new Date().getFullYear());const ms=availableMonths().filter(m=>m.startsWith(y+'/'));setState({monthFilter:ms,filterYear:y});break}
      case'quick-quarter':{const d=new Date();const y=d.getFullYear();const q=Math.floor(d.getMonth()/3);const qm=[0,1,2].map(i=>`${y}/${String(q*3+i+1).padStart(2,'0')}`);const ms=availableMonths().filter(m=>qm.includes(m));setState({monthFilter:ms.length?ms:qm,filterYear:String(y)});break}
      case'toggle-filters':{const yrs=availableYears();setState({filtersOpen:!S.filtersOpen,filterYear:S.filterYear||yrs[0]||'2026'});break}
      case'set-year':setState({filterYear:el.dataset.year});break;
      case'confirm-cme':{
        e.stopPropagation();
        const id=parseInt(el.dataset.id);
        const orig=el.innerHTML;
        el.innerHTML='⏳ <span>...</span>';el.disabled=true;
        supabaseApi('PATCH','/baviera_control?id=eq.'+id,{cme:1}).then(()=>{
          return loadRecords();
        }).then(()=>{setState({})}).catch(err=>{
          el.innerHTML=orig;el.disabled=false;
          alert('Erro: '+err.message);
        });
        break;
      }
      case'share-carteira':{
        const f=filtered();
        const mLabel=S.monthFilter.length===1?S.monthFilter[0]:S.monthFilter.length>1?S.monthFilter.join(', '):'Todos os meses';
        let txt='CARTEIRA - '+mLabel+' ('+f.length+' registos)\n\n';
        f.forEach(function(r,i){
          txt+=(i+1)+'. '+esc(r.id_cliente||'—')+'\n';
          txt+='   Modelo: '+(r.model||'')+' '+(r.version||'')+'\n';
          txt+='   Bizagi: '+(r.biz||'—')+'\n';
          txt+='   Encomenda: '+(r.enc||'—')+'\n';
          txt+='   Chassis: '+(r.chas||'—')+'\n';
          txt+='   Financiamento: '+(r.fin||'—')+'\n';
          txt+='   CME: '+(r.cme?'Sim':'Não')+'\n\n';
        });
        navigator.clipboard.writeText(txt).then(function(){
          el.textContent='✓ Copiado!';el.style.background='var(--green)';el.style.color='#fff';el.style.borderColor='var(--green)';
          setTimeout(function(){el.textContent='📤 Partilhar Carteira ('+f.length+')';el.style.background='';el.style.color='';el.style.borderColor=''},2000);
        }).catch(function(){
          var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
          el.textContent='✓ Copiado!';
          setTimeout(function(){el.textContent='📤 Partilhar Carteira ('+f.length+')'},2000);
        });
        break;
      }
      case'open-detail':{const id=parseInt(el.dataset.id),r=S.records.find(x=>x.id===id);if(r)setState({selected:r,screen:'detail',confirmDelete:false,openGroups:{INFO:true}});break}
      case'back-to-list':setState({screen:'list',selected:null});break;
      case'open-edit':setState({form:recordToForm(S.selected||{}),screen:'edit',error:'',openGroups:{INFO:true}});break;
      case'open-add':setState({selected:null,form:emptyForm(),screen:'edit',error:'',openGroups:{INFO:true}});break;
      case'back-from-edit':setState({screen:S.selected?'detail':'list',error:''});break;
      case'save-record':collectFormData();saveRecord();break;
      case'toggle-section':{const g=el.dataset.group;S.openGroups[g]=!S.openGroups[g];if(S.screen==='edit')collectFormData();render();break}
      case'toggle-flag':{collectFormData();S.form[el.dataset.field]=S.form[el.dataset.field]?false:true;render();break}
      case'ask-delete':setState({confirmDelete:true});break;
      case'copy-matricula':copiarTexto(textoMatricula(S.selected),el);break;
      case'copy-venda':copiarTexto(textoVenda(S.selected),el);break;
      case'cancel-delete':setState({confirmDelete:false});break;
      case'confirm-delete':deleteRecord();break;
    }
  };
  const si=document.getElementById('f-search');
  if(si){si.oninput=function(){S.search=this.value;S.renderLimit=50;if(window._sd)clearTimeout(window._sd);window._sd=setTimeout(function(){const p=document.getElementById('f-search')?document.getElementById('f-search').selectionStart:0;render();const el=document.getElementById('f-search');if(el){el.focus();el.setSelectionRange(p,p)}},250)}}
  const pw=document.getElementById('f-pw');
  if(pw)pw.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-action="login"]')?.click()}}
}

function collectFormData(){document.querySelectorAll('input[data-field],select[data-field],textarea[data-field]').forEach(el=>{const k=el.dataset.field;let v=el.value;if(el.dataset.fmt==='month'&&v)v=v.replace('-','/');S.form[k]=v})}

function afterAuth(){return loadMe().then(function(){const extra=isAdmin()?Promise.all([loadTeam(),loadObjetivos(),loadObjEquipa(),loadNps(),loadEventos(),loadInscricoes(),loadTransicoes(),loadNorma()]):Promise.all([loadTeam(),loadEventos(),loadInscricoes()]);return extra}).then(function(){return loadRecords()}).then(function(){const ev=eventoAtivo();return loadRanking(ev?ev.id:null)}).then(function(){setState({screen:isAdmin()?'dashboard':'list',loading:false})})}
(function(){
  S.screen='loading';render();
  refreshSession().then(function(token){
    if(token){S.token=token;return afterAuth()}
    else{setState({screen:'login'})}
  }).catch(function(e){clearSession();setState({screen:'login',error:e&&e.message?e.message:''})});
})();
</script>
</body>
</html>
